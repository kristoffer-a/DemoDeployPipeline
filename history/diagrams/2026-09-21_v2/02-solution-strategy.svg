<tspan x="60" dy="0">READ ACROSS  /  The same business solution moves from Dev to Test to Prod. Each row can release independently.</tspan>
</text>
<text x="60" y="1155" fill="#172B3A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">
<tspan x="60" dy="0">READ DOWN  /  Multiple solutions share the environment. Custom component dependencies between business solutions are prohibited.</tspan>
</text>
<rect x="60" y="1180" width="1680" height="69" rx="14" fill="#E6F5F1" stroke="#E6F5F1" stroke-width="1.5"/>
<text x="80" y="1208" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start">
<tspan x="80" dy="0">SharePoint remains outside Power Platform. Site names above are illustrative mappings, not a requirement for one site per solution.</tspan>
<tspan x="80" dy="21.6">Dataverse stores solution metadata. Runtime identities are assigned from the available service accounts; no account per solution is implied.</tspan>
</text>
