</text>
<polyline points="975,270.5 900,270 900,420 355,420.0" fill="none" stroke="#7353AC" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<polyline points="1353.0,365 1350,450 810,450 809.0,350" fill="none" stroke="#7353AC" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<polyline points="237.5,475 238,755 1058,755 1057.5,705" fill="none" stroke="#087F78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600.0" y="753" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">
<tspan x="600.0" dy="0">app user’s own SharePoint connection and permissions</tspan>
</text>
<polyline points="795.0,495 795,775 1252,775 1252.5,705" fill="none" stroke="#087F78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="965.0" y="767" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">
<tspan x="965.0" dy="0">flow uses the configured connection identity</tspan>
</text>
<polyline points="1183.25,365 1440.0,600" fill="none" stroke="#7353AC" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="1455.0" y="468" fill="#7353AC" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle">
<tspan x="1455.0" dy="0">group membership</tspan>
</text>
<text x="40" y="854" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">
<tspan x="40" dy="0">Solid arrows show runtime behaviour. Dashed arrows show configuration or access assignment. Each environment has its own connections, groups, site and list mapping.</tspan>
</text>
</svg>