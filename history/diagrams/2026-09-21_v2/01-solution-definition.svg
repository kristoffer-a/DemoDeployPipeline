<tspan x="1275" dy="0">Used by cloud-flow connections</tspan>
</text>
<text x="970" y="530" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">
<tspan x="970" dy="0">SHAREPOINT</tspan>
</text>
<text x="970" y="556" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">
<tspan x="970" dy="0">Business data and role-based site access</tspan>
</text>
