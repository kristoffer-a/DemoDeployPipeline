<text x="995" y="631" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">
<tspan x="995" dy="0">SharePoint site</tspan>
</text>
<text x="995" y="668" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="995" dy="0">Stage-specific</tspan>
<tspan x="995" dy="22.950000000000003">location</tspan>
</text>
<rect x="1170" y="600" width="165" height="105" rx="14" fill="#E6F5F1" stroke="#087F78" stroke-width="1.5"/>
<text x="1190" y="631" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">
<tspan x="1190" dy="0">Lists</tspan>
</text>
<text x="1190" y="668" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="1190" dy="0">Business data</tspan>
<tspan x="1190" dy="22.950000000000003">and schema</tspan>
</text>
<rect x="1365" y="600" width="150" height="105" rx="14" fill="white" stroke="#087F78" stroke-width="1.5"/>
<text x="1385" y="631" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">
