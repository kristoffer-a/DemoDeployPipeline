<text x="440" y="586" fill="#7353AC" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">
<tspan x="440" dy="0">Connection references</tspan>
</text>
<text x="440" y="623" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="440" dy="0">Included in the solution</tspan>
</text>
<text x="792.5" y="288" fill="#1766B3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
