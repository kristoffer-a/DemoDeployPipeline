<text x="140" y="586" fill="#7353AC" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">
<tspan x="140" dy="0">Environment variables</tspan>
</text>
<text x="140" y="623" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="140" dy="0">Site, list and stage-specific</tspan>
<tspan x="140" dy="22.950000000000003">values</tspan>
</text>
