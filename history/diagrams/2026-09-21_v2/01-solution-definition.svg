</text>
<text x="745" y="418" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="745" dy="0">App user’s own</tspan>
<tspan x="745" dy="22.950000000000003">SharePoint connection</tspan>
<tspan x="745" dy="22.950000000000003">Flow service-account</tspan>
<tspan x="745" dy="22.950000000000003">connection</tspan>
</text>
<text x="970" y="195" fill="#7353AC" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">
<tspan x="970" dy="0">MICROSOFT ENTRA ID</tspan>
</text>
<text x="970" y="221" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">
<tspan x="970" dy="0">Security groups and licensed identities</tspan>
</text>
