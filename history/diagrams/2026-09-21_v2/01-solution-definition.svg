<rect x="1255" y="260" width="245" height="105" rx="14" fill="white" stroke="#7353AC" stroke-width="1.5"/>
<text x="1275" y="291" fill="#7353AC" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">
<tspan x="1275" dy="0">Licensed service accounts</tspan>
</text>
