<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1600" height="1000" fill="#F3F7FA"/>
<text x="40" y="72" fill="#172B3A" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start">
<tspan x="40" dy="0">A solution: application, data and identity boundaries</tspan>
</text>
<text x="40" y="111" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="40" dy="0">One business capability. Direct app calls use the signed-in person’s SharePoint permissions; flow calls use the configured connection identity.</tspan>
</text>
<rect x="40" y="150" width="850" height="650" rx="18" fill="#EAF3FD" stroke="#1766B3" stroke-width="1.5"/>
<rect x="940" y="150" width="600" height="285" rx="18" fill="#F1ECF8" stroke="#7353AC" stroke-width="1.5"/>
<rect x="940" y="485" width="600" height="315" rx="18" fill="#E6F5F1" stroke="#087F78" stroke-width="1.5"/>
<rect x="85" y="255" width="615" height="465" rx="18" fill="white" stroke="#1766B3" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="70" y="195" fill="#1766B3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">
<tspan x="70" dy="0">POWER PLATFORM</tspan>
</text>
<text x="70" y="221" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">
<tspan x="70" dy="0">Shared environment — Dev, Test or Prod</tspan>
</text>
<text x="110" y="292" fill="#1766B3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">
<tspan x="110" dy="0">SOLUTION PACKAGE</tspan>
</text>
<text x="110" y="319" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">
<tspan x="110" dy="0">Unmanaged in Dev • managed in Test and Prod</tspan>
</text>
<rect x="120" y="365" width="235" height="110" rx="14" fill="#EAF3FD" stroke="#1766B3" stroke-width="1.5"/>
<text x="140" y="397" fill="#1766B3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">
<tspan x="140" dy="0">Canvas app</tspan>
</text>
<text x="140" y="433" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="140" dy="0">User experience and</tspan>
<tspan x="140" dy="22.950000000000003">business logic</tspan>
</text>
<rect x="420" y="365" width="235" height="110" rx="14" fill="#EAF3FD" stroke="#1766B3" stroke-width="1.5"/>
<text x="440" y="397" fill="#1766B3" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start">
<tspan x="440" dy="0">Cloud flows</tspan>
</text>
<text x="440" y="433" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="440" dy="0">Automation for this</tspan>
<tspan x="440" dy="22.950000000000003">business need</tspan>
</text>
