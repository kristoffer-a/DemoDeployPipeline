</text>
<text x="995" y="328" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="995" dy="0">Canvas app sharing</tspan>
<tspan x="995" dy="22.950000000000003">May be added to</tspan>
<tspan x="995" dy="22.950000000000003">SharePoint groups</tspan>
