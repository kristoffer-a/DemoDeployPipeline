<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1800" height="1360" fill="#F3F7FA"/>
<text x="60" y="43" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">
<tspan x="60" dy="0">03  /  POWER PLATFORM ALM</tspan>
</text>
<text x="60" y="100" fill="#172B3A" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" text-anchor="start">
<tspan x="60" dy="0">Deployment pipeline</tspan>
</text>
<text x="60" y="137" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">
<tspan x="60" dy="0">Manual export and import today. The same controlled sequence can later be automated.</tspan>
</text>
<rect x="60" y="185" width="1680" height="235" rx="14" fill="#EAF3FD" stroke="#EAF3FD" stroke-width="1.5"/>
<text x="80" y="216" fill="#1766B3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">
<tspan x="80" dy="0">DEV  /  BUILD &amp; PACKAGE</tspan>
</text>
<rect x="60" y="475" width="1680" height="345" rx="14" fill="#F1ECF8" stroke="#F1ECF8" stroke-width="1.5"/>
<text x="80" y="506" fill="#7353AC" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">
<tspan x="80" dy="0">TEST  /  VALIDATE</tspan>
</text>
<rect x="60" y="870" width="1680" height="415" rx="14" fill="#E6F5F1" stroke="#E6F5F1" stroke-width="1.5"/>
<text x="80" y="901" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">
<tspan x="80" dy="0">PROD  /  RELEASE &amp; VERIFY</tspan>
</text>
<rect x="220" y="264" width="300" height="116" rx="14" fill="white" stroke="#1766B3" stroke-width="1.5"/>
<text x="240" y="299" fill="#1766B3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">
<tspan x="240" dy="0">1  Build in Dev</tspan>
</text>
<text x="240" y="332" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="240" dy="0">Update the unmanaged solution.</tspan>
<tspan x="240" dy="22.950000000000003">Complete checks and publish.</tspan>
</text>
<rect x="680" y="264" width="300" height="116" rx="14" fill="white" stroke="#1766B3" stroke-width="1.5"/>
<text x="700" y="299" fill="#1766B3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">
<tspan x="700" dy="0">2  Version and export</tspan>
</text>
<text x="700" y="332" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="700" dy="0">Managed deployment ZIP</tspan>
<tspan x="700" dy="22.950000000000003">Unmanaged source snapshot</tspan>
</text>
<rect x="1140" y="264" width="480" height="116" rx="14" fill="white" stroke="#1766B3" stroke-width="1.5"/>
<text x="1160" y="299" fill="#1766B3" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">
<tspan x="1160" dy="0">3  Archive the release bundle</tspan>
</text>
<text x="1160" y="332" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="1160" dy="0">Packages + manifest + SharePoint changes</tspan>
<tspan x="1160" dy="22.950000000000003">Record version and package checksum.</tspan>
</text>
<polyline points="520,322.0 680,322.0" fill="none" stroke="#1766B3" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="980,322.0 1140,322.0" fill="none" stroke="#1766B3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1290" y="551" width="340" height="126" rx="14" fill="white" stroke="#7353AC" stroke-width="1.5"/>
<text x="1310" y="586" fill="#7353AC" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">
<tspan x="1310" dy="0">4  Prepare Test</tspan>
</text>
<text x="1310" y="619" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="1310" dy="0">Provision / update SharePoint.</tspan>
<tspan x="1310" dy="22.950000000000003">Prepare connections and values.</tspan>
</text>
<rect x="830" y="551" width="340" height="126" rx="14" fill="white" stroke="#7353AC" stroke-width="1.5"/>
<text x="850" y="586" fill="#7353AC" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">
<tspan x="850" dy="0">5  Import into Test</tspan>
</text>
<text x="850" y="619" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="850" dy="0">Import the managed package.</tspan>
<tspan x="850" dy="22.950000000000003">Bind Test connections and values.</tspan>
</text>
<rect x="370" y="551" width="340" height="126" rx="14" fill="white" stroke="#7353AC" stroke-width="1.5"/>
<text x="390" y="586" fill="#7353AC" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">
<tspan x="390" dy="0">6  Verify the release</tspan>
</text>
<text x="390" y="619" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="390" dy="0">Check target data and flow state.</tspan>
<tspan x="390" dy="22.950000000000003">Run functional testing and UAT.</tspan>
</text>
<polygon points="195.0,541.5 300,614.0 195.0,686.5 90,614.0" fill="#FFF5DD" stroke="#986310" stroke-width="1.5"/>
<text x="195.0" y="608.0" fill="#986310" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
<tspan x="195.0" dy="0">Tests</tspan>
<tspan x="195.0" dy="25.650000000000002">passed?</tspan>
</text>
<polyline points="1380.0,380 1380,446 1460,446 1460.0,551" fill="none" stroke="#7353AC" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1290,614.0 1170,614.0" fill="none" stroke="#7353AC" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="830,614.0 710,614.0" fill="none" stroke="#7353AC" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="370,614.0 300,614.0" fill="none" stroke="#7353AC" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="90,614.0 35,614 35,322 220,322.0" fill="none" stroke="#986310" stroke-width="2" marker-end="url(#arrow)"/>
<text x="70" y="442" fill="#986310" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">
<tspan x="70" dy="0">NO  /  Fix in Dev, create a new version and repeat</tspan>
</text>
<text x="385" y="739" fill="#7353AC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">
<tspan x="385" dy="0">The Test result and acceptance evidence refer to the exact archived managed package.</tspan>
</text>
<rect x="90" y="942" width="300" height="132" rx="14" fill="white" stroke="#087F78" stroke-width="1.5"/>
<text x="110" y="977" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">
<tspan x="110" dy="0">7  Release approval</tspan>
</text>
<text x="110" y="1010" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="110" dy="0">Approve the exact release bundle.</tspan>
<tspan x="110" dy="22.950000000000003">If withheld: hold at this step.</tspan>
</text>
<rect x="490" y="942" width="300" height="132" rx="14" fill="white" stroke="#087F78" stroke-width="1.5"/>
<text x="510" y="977" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">
<tspan x="510" dy="0">8  Prepare Prod</tspan>
</text>
<text x="510" y="1010" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="510" dy="0">Apply planned SharePoint changes.</tspan>
<tspan x="510" dy="22.950000000000003">Prepare Prod configuration.</tspan>
</text>
<rect x="890" y="942" width="300" height="132" rx="14" fill="white" stroke="#087F78" stroke-width="1.5"/>
<text x="910" y="977" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start">
<tspan x="910" dy="0">9  Import into Prod</tspan>
</text>
<text x="910" y="1010" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="910" dy="0">Use the managed ZIP from step 3.</tspan>
<tspan x="910" dy="22.950000000000003">Bind Prod connections and values.</tspan>
</text>
<polygon points="1400.0,929 1520,1008.0 1400.0,1087 1280,1008.0" fill="#FFF5DD" stroke="#986310" stroke-width="1.5"/>
<text x="1400.0" y="1002.0" fill="#986310" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle">
<tspan x="1400.0" dy="0">10  Smoke test</tspan>
<tspan x="1400.0" dy="25.650000000000002">passed?</tspan>
</text>
<rect x="1570" y="970" width="145" height="73" rx="14" fill="#E6F5F1" stroke="#087F78" stroke-width="1.5"/>
<text x="1590" y="1003" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">
<tspan x="1590" dy="0">Released</tspan>
</text>
<rect x="1230" y="1162" width="465" height="92" rx="14" fill="#FFF5DD" stroke="#986310" stroke-width="1.5"/>
<text x="1250" y="1196" fill="#986310" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start">
<tspan x="1250" dy="0">Recover / correct</tspan>
</text>
<text x="1250" y="1230" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="1250" dy="0">Follow the agreed recovery plan; retest.</tspan>
</text>
<polyline points="195.0,686.5 195,853 340,853 340.0,942" fill="none" stroke="#087F78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="211" y="784" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start">
<tspan x="211" dy="0">YES</tspan>
</text>
<polyline points="390,1008.0 490,1008.0" fill="none" stroke="#087F78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="395" y="993" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start">
<tspan x="395" dy="0">approved</tspan>
</text>
<polyline points="790,1008.0 890,1008.0" fill="none" stroke="#087F78" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1190,1008.0 1280,1008.0" fill="none" stroke="#087F78" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1520,1008.0 1570,1006.5" fill="none" stroke="#087F78" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1525" y="989" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start">
<tspan x="1525" dy="0">YES</tspan>
</text>
<polyline points="1400.0,1087 1400.0,1162" fill="none" stroke="#986310" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1423" y="1131" fill="#986310" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">
<tspan x="1423" dy="0">NO</tspan>
</text>
<polyline points="1230,1208.0 1210,1208 1210,1107 1340,1107 1340.0,1047.5" fill="none" stroke="#986310" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="92" y="1155" fill="#087F78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start">
<tspan x="92" dy="0">PROMOTION RULE</tspan>
</text>
<text x="92" y="1193" fill="#172B3A" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">
<tspan x="92" dy="0">One managed artifact travels through Test and Prod.</tspan>
<tspan x="92" dy="25.650000000000002">A change to the package returns to Dev and Test; it requires renewed approval.</tspan>
</text>
<text x="60" y="1327" fill="#526775" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start">
<tspan x="60" dy="0">Release completion: record the deployed version, configuration, approval and verification result. Monitor the solution after release.</tspan>
</text>
</svg>