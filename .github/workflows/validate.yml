name: Validate pipeline source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest pipeline/tests -q
      - run: python -m unittest discover -s integrations/flowerror-readiness/tests -v
      - run: python -m pipeline.deploy --dry-run
      - run: node --test docs/alm/flowagent-auth-policy.test.mjs
      - run: git diff --exit-code
